services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tcm
      POSTGRES_PASSWORD: tcm
      POSTGRES_DB: tcm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcm -d tcm"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tcm:tcm@postgres:5432/tcm
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      # 本地 GPU 向量化服务（宿主机跑 tools/embed_server.py，Apple Silicon MPS）。
      # Docker on macOS 拿不到 GPU，所以服务必须跑在宿主机，容器经 host.docker.internal 调用。
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8100/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
      - ./backend/tools:/app/tools
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
